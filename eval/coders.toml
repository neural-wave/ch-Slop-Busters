# ICD-10 coder registry for `python3 -I eval score --icd <name> ...`. One table per coder; the table name is the
# coder's name in the scores (icd.<name>) and its cache folder (data/eval/cache/icd/<name>/).
#
#   kind         ollama | knn | lexical | command | agent
#   default      true: in the default --icd set (every enabled coder with default = true)
#   enabled      false: listed but never run, even when named (default true)
#   primary      true: the coder the report headlines (one of them)
#   suites       only these suites (default: every suite whose records have gold codes)
#   description  one line for the docs and the report
#
#   ollama       model (installed, never pulled), inputs ("note": the note only; "both": dialogue and note), context
#                (num_ctx; a longer prompt is rejected, never truncated), max_output, seed, device ("auto": Ollama
#                decides; "cpu": no GPU layers), timeout (s per request), retries. Unranked: the whole set is scored
#   knn          k (neighbours). Ranked, cut at k = number of gold codes
#   lexical      ranked, cut at k
#   agent        model (the agents' model, recorded in the cache key), inputs ("note"): predictions come only from
#                `python3 -I eval judge import` (agents run from a prompt package, eval/coders/agent.py). Unranked
#   command      cmd: argv list with {input} {output} {python} {repo} {container} {here}; timeout; ranked (default
#                true); inputs. Contract in eval/coders/command.py
#
# Ad hoc, without an entry: --icd "cmd:<command line with {input} {output}>".

[llm_judge]
description = "LLM judge: Claude Sonnet 5.5 agents code each note (ICD-10-CM, note only) from a prompt, every version of a note in a different batch; repeat passes combined by majority vote per note"
kind = "agent"
primary = true
default = true
model = "claude-sonnet-5-5"
inputs = "note"
suites = ["aci_eval"]

[tree]
description = "Decision tree over ICD-10 lexicon candidates (decision-models, fit on the 140 ACI train encounters; CPU, numpy). Its headline is the category (3-char) level"
kind = "command"
default = true
ranked = false
cmd = ["{python}", "-I", "{here}/tree_coder.py", "--input", "{input}", "--output", "{output}"]
timeout = 600
# F1 on aci_eval; agreement only on the Kaggle medical suites (no gold codes, except devp's 5): CPU, about 1 s per suite
suites = ["aci_eval", "devp_discharge", "imerit_en", "imerit_multi", "sadiqguru", "nbme_notes", "pmc_patients"]

[knn]
description = "TF-IDF k-nearest neighbours over the 140 ACI train encounters, clinical words only (supervised: ACI label space)"
kind = "knn"
default = true
k = 7
suites = ["aci_eval", "aci_dev"]

[lexical]
description = "Zero-shot: ranks the suite + ACI label space by idf-weighted description words found in the text"
kind = "lexical"
default = true

[paper]
description = "Slot for the full paper coder (candidate expansion and verification); point cmd at it, then enable"
kind = "command"
enabled = false
default = false
ranked = false
cmd = ["{python}", "-I", "{container}/daniel-eval/scripts/paper_coder.py", "--input", "{input}", "--output", "{output}"]
timeout = 7200

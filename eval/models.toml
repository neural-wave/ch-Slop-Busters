# Model registry for `python3 -I eval run`. One table per model run configuration.
#
#   cmd          argv list; placeholders: {input} {output} {labels} {suite} {python} {here} {repo} {container}
#                ({here} is eval/adapters, {python} the harness's interpreter)
#   cwd          working directory (same placeholders)
#   env          extra environment variables
#   timeout      seconds before the run is killed with its whole process tree (default 3600); recorded as exit 124
#                (a descendant that daemonized itself away from the tree is not found)
#   fingerprint  path, directory or glob (or a list of them, same placeholders, relative ones from cwd) whose files
#                are hashed with the command into the run's code_sha1: when the model's code changes, its runs are redone
#   precomputed  instead of cmd: path to an already anonymized JSONL per suite, e.g. ".../{suite}.jsonl"
#   blind_codes  true: the model gets icd10_codes = [] (bonus task "without ICD-10 codes"); the runner puts the
#                original codes back before scoring, so the validity check only tests the text fields
#   base         the model a blind_codes entry is compared with (default: its name without "_nocodes")
#   reads_codes  false: the model never reads icd10_codes, so a blind_codes twin would be identical (the report's
#                ablation says so instead of listing it as missing)
#   suites       only run on these suites (default: all)
#   enabled      false: listed in the report as pending, never run
#
# {input} is the suite's encounters.jsonl (challenge schema only). A model must write {output} with the same
# records, order and keys, and icd10_codes unchanged.

[identity]
description = "Reference: returns the input unchanged (privacy 0, utility 1). Sanity check for the metrics"
cmd = ["{python}", "-I", "{here}/baselines.py", "identity", "{input}", "{output}"]
fingerprint = ["{here}/baselines.py", "{here}/../common.py"]

[ad_rules]
description = "A+D night model (neural_wave 93b5eea), balanced preset, rules only (CPU, no ML dependencies)"
cwd = "{repo}/models/ad-night/repo"
env = { HF_HUB_OFFLINE = "1" }
cmd = ["{repo}/models/ad-night/repo/.venv/bin/neural-wave", "anonymize", "-i", "{input}", "-o", "{output}", "--preset", "balanced", "--detectors", "rules"]
fingerprint = ["{repo}/models/ad-night/repo/src/**/*.py", "{repo}/models/ad-night/repo/src/**/*.gz"]

[ad_night]
description = "A+D night model, their submission config: balanced, rules + deid_roberta + GLiNER"
cwd = "{repo}/models/ad-night/repo"
env = { HF_HUB_OFFLINE = "1" }
cmd = ["{repo}/models/ad-night/repo/.venv/bin/neural-wave", "anonymize", "-i", "{input}", "-o", "{output}", "--preset", "balanced", "--detectors", "rules,deid,gliner"]
fingerprint = ["{repo}/models/ad-night/repo/src/**/*.py", "{repo}/models/ad-night/repo/src/**/*.gz"]

[ad_night_nocodes]
description = "A+D submission config without ICD-10 codes at inference (bonus task)"
cwd = "{repo}/models/ad-night/repo"
env = { HF_HUB_OFFLINE = "1" }
blind_codes = true
cmd = ["{repo}/models/ad-night/repo/.venv/bin/neural-wave", "anonymize", "-i", "{input}", "-o", "{output}", "--preset", "balanced", "--detectors", "rules,deid,gliner", "--no-codes"]
fingerprint = ["{repo}/models/ad-night/repo/src/**/*.py", "{repo}/models/ad-night/repo/src/**/*.gz"]

[ad_night_submitted]
description = "A+D's own submission file (made on their Mac): checks our scorer against their 0.839 and our ad_night run against theirs"
suites = ["aci_eval"]
precomputed = "{repo}/models/ad-night/repo/outputs/anonymized_eval_patient_doctor_encounters.jsonl"

[anonymous_rules]
reads_codes = false
description = "Anonymous model (models/anonymous, the VM backup): regex + structural name layers, every detected span -> [TYPE]"
cwd = "{repo}/models/anonymous"
cmd = ["{repo}/models/anonymous/.venv/bin/python", "-I", "{here}/anonymous_vm.py", "{input}", "{output}", "--layers", "regex,names", "--words", "{repo}/models/anonymous/american-english-large"]
fingerprint = ["{here}/anonymous_vm.py", "{repo}/models/anonymous/detect/**/*.py", "{repo}/models/anonymous/common.py",
               "{repo}/models/anonymous/american-english-large"]

[anonymous]
reads_codes = false
description = "Anonymous model (models/anonymous, the VM backup): regex + names + deid_roberta + GLiNER, every detected span -> [TYPE]"
cwd = "{repo}/models/anonymous"
env = { HF_HUB_OFFLINE = "1" }
cmd = ["{repo}/models/anonymous/.venv/bin/python", "-I", "{here}/anonymous_vm.py", "{input}", "{output}", "--layers", "regex,names,deid,gliner", "--words", "{repo}/models/anonymous/american-english-large"]
fingerprint = ["{here}/anonymous_vm.py", "{repo}/models/anonymous/detect/**/*.py", "{repo}/models/anonymous/common.py",
               "{repo}/models/anonymous/american-english-large"]

[unified_harness_rules]
description = "unified-harness (this repo, src/unified_harness), privacy preset, rules only (CPU, no LLM)"
cmd = ["{python}", "-I", "{here}/unified_harness.py", "{input}", "{output}", "--mode", "rules", "--preset", "privacy"]
fingerprint = ["{here}/unified_harness.py", "{repo}/src/unified_harness/**/*.py", "{repo}/src/unified_harness/**/*.gz",
               "{repo}/src/unified_harness/**/*.toml"]

[unified_harness]
description = "unified-harness, its default config: llm mode (rules + qwen3.5:2b-q4_K_M via Ollama), privacy preset (F0 + F2), cold LLM cache per run"
timeout = 14400
cmd = ["{python}", "-I", "{here}/unified_harness.py", "{input}", "{output}", "--mode", "llm", "--preset", "privacy"]
fingerprint = ["{here}/unified_harness.py", "{repo}/src/unified_harness/**/*.py", "{repo}/src/unified_harness/**/*.gz",
               "{repo}/src/unified_harness/**/*.toml"]

[unified_harness_nocodes]
description = "unified-harness default config without ICD-10 codes at inference (bonus task)"
blind_codes = true
timeout = 14400
cmd = ["{python}", "-I", "{here}/unified_harness.py", "{input}", "{output}", "--mode", "llm", "--preset", "privacy", "--no-codes"]
fingerprint = ["{here}/unified_harness.py", "{repo}/src/unified_harness/**/*.py", "{repo}/src/unified_harness/**/*.gz",
               "{repo}/src/unified_harness/**/*.toml"]

[unified_harness_submitted]
description = "unified-harness's delivered aci_eval file (2026-10-18): checks our unified_harness run against it"
suites = ["aci_eval"]
precomputed = "{repo}/data/delivered/anonymized-2026-10-18-unified-harness.jsonl"

[term_generalizer]
description = "Term-generalizer: PPO pilot of the zero-shot LLM, generalize mode (ages and dates as ranges), vLLM in 4 GB; delivered JSONL"
suites = ["aci_eval"]
precomputed = "{repo}/data/delivered/vllm4gb-pilot-ppo_generalize.jsonl"

[term_generalizer_nocodes]
description = "Term-generalizer without ICD-10 codes at inference (bonus task); delivered JSONL"
suites = ["aci_eval"]
blind_codes = true
precomputed = "{repo}/data/delivered/vllm4gb-pilot-ppo_generalize_noicd_ablation.jsonl"

[zeroshot]
reads_codes = false
description = "Zero-shot baseline: qwen3.5:2b (Ollama) returns the PII spans of each chunk as JSON, each span -> [TYPE]. Never reads the codes"
suites = ["aci_eval"]
timeout = 14400
cmd = ["{python}", "-I", "{here}/zeroshot_llm.py", "{input}", "{output}", "--mode", "extract", "--model", "qwen3.5:2b-q4_K_M", "--workers", "1"]
fingerprint = ["{here}/zeroshot_llm.py", "{repo}/models/zeroshot/anonymize.py", "{repo}/models/zeroshot/common.py"]

[ketai]
description = "Ketai's model (work in progress). Point cmd or precomputed at it when it lands"
enabled = false
precomputed = "{repo}/models/ketai/outputs/{suite}.jsonl"

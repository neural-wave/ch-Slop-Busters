# Offline run (default llm mode): the harness and a local Ollama server on an internal network without
# internet. A one-shot setup service downloads the detector model first, into a Docker volume.
#
#   docker compose run --rm harness doctor
#   docker compose run --rm harness anonymize --input /data/eval_patient_doctor_encounters.jsonl
#
# Another model:  DETECTOR_MODEL=llama3.2:3b docker compose run --rm harness anonymize ... --allow-unpinned
#
# Only ollama-pull has internet access, and it handles model weights only; the containers that read the
# data (ollama, harness) sit on the internal network. ./data is mounted read-only, results go to ./outputs.
# For full mode (PyTorch encoders) build target `full` and mount ./models.
name: unified-harness

x-ollama-image: &ollama-image
  # same version as the Ollama used for the measured runs; multi-arch index pinned by digest
  ollama/ollama:0.40.6@sha256:265409e1d931028a8f7d5a32bcbafddd7bffbc6cc629d77efe9560adf692a5e7

services:
  ollama-pull:
    image: *ollama-image
    networks: [fetch]
    volumes:
      - ollama-models:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve >/tmp/ollama.log 2>&1 &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        if ollama list | grep -q "^${DETECTOR_MODEL:-qwen3.5:2b-q4_K_M}[[:space:]]"; then
          echo "${DETECTOR_MODEL:-qwen3.5:2b-q4_K_M} is already downloaded"
        else
          echo "downloading ${DETECTOR_MODEL:-qwen3.5:2b-q4_K_M} (first time only)..."
          ollama pull "${DETECTOR_MODEL:-qwen3.5:2b-q4_K_M}"
        fi

  ollama:
    image: *ollama-image
    networks: [offline]
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 10m
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 24

  harness:
    build:
      context: .
      target: rules
    image: unified-harness:rules
    networks: [offline]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      UNIFIED_HARNESS_OLLAMA_URL: http://ollama:11434
      UNIFIED_HARNESS_DETECTOR_MODEL: ${DETECTOR_MODEL:-qwen3.5:2b-q4_K_M}
    volumes:
      - ./data:/data:ro
      - ./outputs:/outputs
    command: ["--help"]

volumes:
  ollama-models: {}  # downloaded models, kept between runs

networks:
  offline:
    internal: true  # no route to the internet: the containers that see patient data
  fetch: {}  # internet access, used only by ollama-pull to download model weights

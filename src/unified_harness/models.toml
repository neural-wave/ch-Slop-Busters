# Pinned model sources (packaged with unified_harness). scripts/download_models.py downloads the Hugging Face entries into
# models/<dir>; `unified-harness doctor` checks that every entry needed by a mode is present and matches its pin.

[huggingface.deid_roberta]
repo = "obi/deid_roberta_i2b2"
revision = "78f2152eb93ddd817290ce8dbe46f1a6685e09fc"
license = "mit"
dir = "deid_roberta_i2b2"
# The repository ships the same weights twice; only the safetensors copy is downloaded.
files = [
    "config.json",
    "merges.txt",
    "model.safetensors",
    "special_tokens_map.json",
    "tokenizer.json",
    "tokenizer_config.json",
    "vocab.json",
]
used_by = ["full"]

[huggingface.gliner_pii]
repo = "knowledgator/gliner-pii-base-v1.0"
revision = "61726e0ad791dcab3e29339bbec3ad42ded65641"
license = "apache-2.0"
dir = "gliner-pii-base-v1.0"
# PyTorch weights only; the ONNX exports are not used.
files = [
    "added_tokens.json",
    "gliner_config.json",
    "pytorch_model.bin",
    "special_tokens_map.json",
    "spm.model",
    "tokenizer.json",
    "tokenizer_config.json",
]
used_by = ["full"]

# Served by a local Ollama instance; pulled with `ollama pull <name>`.
# Default LLM detector (modes `llm` and `full`); another one is chosen with --detector-model.
[ollama.detector]
name = "qwen3.5:2b-q4_K_M"
digest = "1e2d21a4f03ab9e4a9c1976a4b7e88f21de61d65f2c5485d8fde8942be73f1e7"
used_by = ["llm", "full"]

# Ollama models allowed as the LLM detector, pinned by digest (`ollama list` / GET /api/tags).
# The run measures each model's VRAM and stops if it exceeds the 4 GB budget.
[detector_models]
"qwen3.5:2b-q4_K_M" = "1e2d21a4f03ab9e4a9c1976a4b7e88f21de61d65f2c5485d8fde8942be73f1e7"  # 1.9B, Q4_K_M, 1.95 GB
"qwen3.5:2b" = "dfaf2605162e689c8cac330dc4a190c4c50ad30aa47814a8fe9b79fa5127e97e"  # 1.9B, MXFP8, 3.12 GB

[ollama.icd_proxy]
name = "bge-m3:latest"
digest = "7907646426070047a77226ac3e684fbbe8410524f7b4a74d02837e43f2146bab"
used_by = ["eval"]

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Lint and tests on synthetic fixtures only: no challenge data, labels or model weights in CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target rules -t unified-harness:rules .
      - name: Smoke test without network
        run: |
          docker run --rm --network none unified-harness:rules --version
          docker run --rm --network none unified-harness:rules doctor --mode rules
          docker run --rm --network none -v "$PWD/tests/fixtures:/data:ro" unified-harness:rules \
            validate --original /data/encounters.jsonl --anonymized /data/encounters.jsonl
          mkdir -p out && chmod 777 out
          docker run --rm --network none -v "$PWD/tests/fixtures:/data:ro" -v "$PWD/out:/outputs" unified-harness:rules \
            anonymize --mode rules --input /data/encounters.jsonl --out-root /outputs --date 2026-01-01
          docker run --rm --network none -v "$PWD/tests/fixtures:/data:ro" -v "$PWD/out:/outputs" unified-harness:rules \
            validate --original /data/encounters.jsonl \
            --anonymized /outputs/2026-01-01/anonymized-2026-01-01-unified-harness.jsonl
